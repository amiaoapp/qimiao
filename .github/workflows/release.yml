name: Build and publish 启喵

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            # Keep the Chinese product name: NSIS is Unicode-aware, whereas
            # the WiX 3 linker fails on an all-CJK MSI output name.
            args: --bundles nsis
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos-') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 启喵 v__VERSION__
          releaseBody: |
            启喵 / qimiao 跨平台安装包。

            - 项目整体切换为 GNU AGPL-3.0-or-later，并保留 TinyCast 上游版权与修改声明
            - 新增 TinyCast 风格命令中心、剪贴板历史、文件搜索、计算换算、Emoji 与 Apple 快捷指令
            - macOS 可直接导入 `.tinycast`，迁移 Quicklinks、Snippets、Notes、自定义命令与文本剪贴板历史
            - 支持 TinyCast/Raycast 动态占位符、嵌套 Snippet、URL/路径/deeplink Quicklinks
            - 扩展跨平台系统操作及窗口布局操作，危险操作强制确认
            - 保留启喵 Launchpad 式应用主页和中英文界面

            qimiao 0.9.9 adopts AGPL-3.0-or-later and introduces native TinyCast-compatible command models, imports, placeholders, command-center workflows, system actions, and window layouts while retaining qimiao's Launchpad home.

            macOS 构建使用 ad-hoc 签名；Windows 和 Linux 构建未使用商业证书签名。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
