name: Build and publish 启喵

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            # Keep the Chinese product name: NSIS is Unicode-aware, whereas
            # the WiX 3 linker fails on an all-CJK MSI output name.
            args: --bundles nsis
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos-') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 启喵 v__VERSION__
          releaseBody: |
            启喵 / Qimiao 跨平台安装包。

            - Windows 关闭原生阴影与缩放框架，使用外层窗口尺寸裁剪圆角并关闭 DWM 边框颜色
            - Windows 扫描过滤卸载、安装、修复、更新入口，额外目录不再递归收录深层辅助程序
            - Windows 图标直接通过 Shell API 提取快捷方式或 EXE 的真实图标
            - 图标加载标记现在会持久保存，手动导入的应用重启后不再退回字母占位
            - 刷新扫描会保留手动添加的应用，并自动清理旧缓存中的卸载入口

            Windows now removes the native shadow/resize frame, filters maintenance shortcuts, loads icons through the Windows Shell, and preserves manually added apps and their lazy icon markers across restarts.

            macOS 构建使用 ad-hoc 签名；Windows 和 Linux 构建未使用商业证书签名。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
