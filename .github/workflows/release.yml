name: Build and publish 启喵

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            # Keep the Chinese product name: NSIS is Unicode-aware, whereas
            # the WiX 3 linker fails on an all-CJK MSI output name.
            args: --bundles nsis
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos-') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 启喵 v__VERSION__
          releaseBody: |
            启喵 / Qimiao 跨平台安装包。

            - 启喵原生 Raycast 格式扩展运行时：直接安装和运行，不调用 SuperCmd / Raycast 程序
            - 内置扩展商店、命令索引，以及常用 List / Grid / Detail / Form / Action API 兼容层
            - 统一的右上角线性操作图标与交互底板
            - macOS 26+ 原生 Clear Liquid Glass 与改进的深色材质
            - 中英文仓库说明与界面

            Extensions are installed into Qimiao's own data directory and executed by Qimiao's built-in compatibility runtime. No external launcher is required or invoked.

            macOS 构建使用 ad-hoc 签名；Windows 和 Linux 构建未使用商业证书签名。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
