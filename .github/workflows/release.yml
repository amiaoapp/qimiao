name: Build and publish Qimiao

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            # Qimiao is ASCII so every download keeps its product prefix.
            # Retain NSIS for compatibility with existing installations.
            args: --bundles nsis
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils libdbus-1-dev libxcb1-dev libx11-dev libxrandr-dev

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos-') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - run: npm test

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 启喵 Qimiao v__VERSION__
          releaseBody: |
            启喵 Qimiao 1.1.0

            - 修复中文“启喵”搜索不到 Qimiao 的问题；补齐常见应用的中英文双向别名，支持全拼、首字母、全角字母及应用文件名匹配，普通与简洁模式共用搜索逻辑
            - macOS 剪贴板自动粘贴失败时显示具体授权步骤，可直接打开辅助功能和自动化设置；工具栏新增权限指引，支持授权后重试
            - 快捷键录制区分 macOS 的 Ctrl 与 Command，修复反引号、加号和 Option 组合键的记录与显示
            - 应用图标支持拖拽合并成可展开分组，可重命名、追加应用和移出应用；分组随本机设置、备份及 WebDAV 配置同步保存，保留应用原有分类和收藏状态
            - 收藏堆叠内也支持拖拽合并；修复 Windows 原生文件拖放与界面图标拖拽的冲突

            Qimiao 1.1 fixes bilingual app search, including 启喵 / Qimiao aliases, Pinyin and initials, full-width characters and executable names. It adds actionable macOS paste-permission guidance, preserves physical Control and Command shortcuts, and introduces draggable, expandable, renameable app groups with backup and configuration sync support.

            验证：24 组前端测试、21 组 Rust 测试、生产构建及浏览器交互回归。macOS 真实授权与跨应用粘贴、Windows 原生交互仍需实机验证。

            Downloads: macOS Apple Silicon / Intel, Windows x64 NSIS, Linux x64 / ARM64 (deb, rpm, AppImage). Browser tests cover the permission-denial UI using a mock; actual macOS permission grants and cross-app pasting, and native Windows interactions, still need on-device verification.

            macOS 构建使用 ad-hoc 签名；Windows 和 Linux 构建未使用商业证书签名。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  finalize:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Verify installers and publish the complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/publish-release.mjs
