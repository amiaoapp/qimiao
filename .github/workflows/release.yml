name: Build and publish 启喵

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            # Keep the Chinese product name: NSIS is Unicode-aware, whereas
            # the WiX 3 linker fails on an all-CJK MSI output name.
            args: --bundles nsis
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils libdbus-1-dev libxcb1-dev libx11-dev libxrandr-dev

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos-') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - run: npm test

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 启喵 v__VERSION__
          releaseBody: |
            启喵 / qimiao 跨平台安装包。

            - 新增简洁模式：仅保留搜索、最近记录和常用命令，支持键盘选择与一键展开
            - 点击应用即收起启动台，不再等待系统启动完成；收藏应用在每页固定置顶
            - Windows 改用单层 6px 小圆角；图标按实际位图尺寸读取并减少透明/白底留白，刷新旧缓存
            - Windows 统一手动添加入口：桌面、开始菜单、指定文件夹批量勾选，或直接多选程序文件，不在后台自动抓取
            - 新的猫头与启动箭头图标；中性材质、本机字体切换、可关闭动效和窗口拖动
            - 剪贴板支持图片/文件/富文本、分组置顶、编辑导出和接力粘贴；适配 PasteMemo 的部分行为，非完整移植
            - 配置和剪贴板分别支持自有 WebDAV 同步，密码保存在系统密钥库，敏感条目及本地文件路径不上传

            qimiao 0.9.12 adds a compact search palette, immediate hide-on-launch, persistent favorites, a unified manual Windows app importer, actual-size Windows icon extraction and smaller single-layer corners. It also includes a refined cat-and-arrow identity, local font selection, optional motion, a richer clipboard workspace with selected PasteMemo adaptations, and separate opt-in WebDAV sync for configuration and clipboard history. Credentials remain in the OS keychain; sensitive entries and local file paths are excluded from sync.

            验证：前端构建、13 组前端测试、18 组 Rust 测试、macOS 打包及 Windows x64 交叉编译检查通过。Windows 图标和圆角视觉效果仍需实机验证；测试未实际执行关机等电源操作。

            Validation: frontend build and tests, native Rust tests, macOS compilation, and Windows x64 cross-compilation checks passed. Windows icon appearance still needs on-device verification. Power actions were not executed during testing.

            macOS 构建使用 ad-hoc 签名；Windows 和 Linux 构建未使用商业证书签名。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
