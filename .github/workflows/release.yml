name: Build and publish Qimiao

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            # Qimiao is ASCII so every download keeps its product prefix.
            # Retain NSIS for compatibility with existing installations.
            args: --bundles nsis
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils libdbus-1-dev libxcb1-dev libx11-dev libxrandr-dev

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos-') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - run: npm test

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 启喵 Qimiao v__VERSION__
          releaseBody: |
            启喵 Qimiao 1.1.3

            - 改善微信等富文本应用的剪贴板记录兼容性，增加 HTML 转纯文本兜底
            - 支持 UTF-8、UTF-16 以及自定义文本格式，改善 Parallels 等虚拟机复制内容读取
            - 不再误过滤普通的 TransientType 剪贴板内容，继续保留敏感 ConcealedType 过滤

            Qimiao 1.1.3 improves clipboard compatibility with WeChat and other rich-text apps, including an HTML-to-text fallback. It reads UTF-8, UTF-16, and custom text formats to better support copies from Parallels and other virtual machines, while retaining the sensitive ConcealedType filter.

            验证：剪贴板 UTF-8、UTF-16、HTML 单元测试，前端回归测试、生产构建及 Rust 编译检查。微信、Parallels 等真实应用的复制行为仍需在目标设备上确认。

            Downloads: macOS Apple Silicon / Intel, Windows x64 NSIS, Linux x64 / ARM64 (deb, rpm, AppImage). Real-app clipboard behavior still needs on-device verification.

            macOS 构建使用 ad-hoc 签名；Windows 和 Linux 构建未使用商业证书签名。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  finalize:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Verify installers and publish the complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/publish-release.mjs
