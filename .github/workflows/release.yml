name: Build and publish 启喵

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            # Keep the Chinese product name: NSIS is Unicode-aware, whereas
            # the WiX 3 linker fails on an all-CJK MSI output name.
            args: --bundles nsis
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos-') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - run: npm test

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 启喵 v__VERSION__
          releaseBody: |
            启喵 / qimiao 跨平台安装包。

            - 界面更加紧凑，列表模式自动收窄为可滚动单列，统一中性材质与控件阴影
            - 中文系统应用名称、全拼及首字母搜索；支持“终端”“活动”等中文查询
            - 一键智能分类：在本地匹配已有分类，保留手动分类，不确定的应用留作手动整理
            - 跟随系统、浅色与深色主题使用不同图标，修复 macOS 切回跟随系统后的外观状态
            - 首页中文搜索可选关机、重启、睡眠、锁屏、熄屏等系统指令；重要操作需要确认，休眠按平台提供
            - Windows 图标裁掉透明边距后统一可见尺寸与圆角底板，刷新旧图标缓存，空图标不再无限加载

            qimiao 0.9.11 brings a more compact launcher and narrower list view, Chinese system-app aliases and Pinyin search, local smart classification that preserves manual assignments, distinct theme icons with corrected system appearance tracking, searchable platform-specific system actions with confirmation, and normalized Windows icon sizing on consistent rounded tiles.

            验证：前端构建、自动测试、macOS 编译及 Windows x64 交叉编译检查通过。Windows 图标视觉效果仍需实机验证；测试未实际执行关机等电源操作。

            Validation: frontend build and tests, native Rust tests, macOS compilation, and Windows x64 cross-compilation checks passed. Windows icon appearance still needs on-device verification. Power actions were not executed during testing.

            macOS 构建使用 ad-hoc 签名；Windows 和 Linux 构建未使用商业证书签名。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
