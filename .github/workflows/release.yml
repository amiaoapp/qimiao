name: Build and publish Qimiao

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            # Qimiao is ASCII so every download keeps its product prefix.
            # Retain NSIS for compatibility with existing installations.
            args: --bundles nsis
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils libdbus-1-dev libxcb1-dev libx11-dev libxrandr-dev

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos-') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - run: npm test

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 启喵 Qimiao v__VERSION__
          releaseBody: |
            启喵 Qimiao 1.1.5

            - 修复软件内版本号显示错误、安装新版后仍提示升级的问题，统一读取项目版本
            - 剪贴板改为原生后台采集，避免启动台隐藏时网页定时器节流导致漏记
            - 图片解码、转码、缩略图生成和存盘独立处理，减少大图处理期间后续复制漏记
            - 新增暂存和确认接收机制，页面暂时未读取时保留复制记录；超出暂存上限或保存失败时显示提示
            - 改进 macOS UTF-16、富文本、PNG、TIFF 和链接读取，浏览器图片附带网址时优先保存图片
            - 保留隐私过滤与排除应用设置，并显示跳过提示；统一长文本接收上限

            Qimiao 1.1.5 fixes the incorrect in-app version and update prompt. Clipboard capture now runs in a native background thread, with image processing handled separately to reduce missed copies while windows are hidden or large images are being processed. Buffered records are retained until acknowledged. macOS text, rich text, image and URL handling is improved, and skipped records, buffer overflow and storage failures are surfaced in the interface.

            验证：31 项前端测试、31 项 Rust 测试、生产构建及 Windows 交叉编译检查通过。macOS 实机验证了隐藏窗口、大图处理期间连续复制、多种系统剪贴板格式及历史记录接收。

            Downloads: macOS Apple Silicon / Intel, Windows x64 NSIS, Linux x64 / ARM64 (deb, rpm, AppImage).

            macOS 构建使用 ad-hoc 签名；Windows 和 Linux 构建未使用商业证书签名。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  finalize:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Verify installers and publish the complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/publish-release.mjs
