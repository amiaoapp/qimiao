name: Build and publish Qimiao

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            # Qimiao is ASCII so every download keeps its product prefix.
            # Retain NSIS for compatibility with existing installations.
            args: --bundles nsis
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils libdbus-1-dev libxcb1-dev libx11-dev libxrandr-dev

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos-') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - run: npm test

      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 启喵 Qimiao v__VERSION__
          releaseBody: |
            启喵 Qimiao 1.1.6

            - 剪贴板保留收到的 WebP、JPEG、PNG 等原始图片数据和实际体积；历史复制、导出、WebDAV 图片同步不再统一转为 PNG，兼容旧 PNG 历史记录。
            - 修复应用图标加载一直转圈；共享请求、限制并发并提供超时回退，缺失图标先显示应用首字，旧缓存失效后自动重新提取。
            - macOS 改用系统原生接口读取图标，支持系统应用和资源目录中的图标，不再为每个图标启动转换进程。
            - 新增自动加入新安装应用：每 30 秒及唤起窗口时检查安装目录，保留收藏、分类和排序；支持在设置中关闭，兼容扫描结果确认。
            - 过滤嵌入式辅助应用和复制未完成的 macOS 安装包。

            Downloads: macOS Apple Silicon / Intel, Windows x64 NSIS, Linux x64 / ARM64 (deb, rpm, AppImage).

            macOS 构建使用 ad-hoc 签名；Windows 和 Linux 构建未使用商业证书签名。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  finalize:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Verify installers and publish the complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/publish-release.mjs
