name: Build and publish Qimiao

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            # Qimiao is ASCII so every download keeps its product prefix.
            # Retain NSIS for compatibility with existing installations.
            args: --bundles nsis
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils libdbus-1-dev libxcb1-dev libx11-dev libxrandr-dev

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos-') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - run: npm test

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 启喵 Qimiao v__VERSION__
          releaseBody: |
            启喵 Qimiao 1.0.0 正式版 / Stable release

            - 正式英文名 Qimiao；猫头图标中间改为字母 Q，安装包使用英文前缀，修复下载文件名丢失软件名称的问题
            - 修复上下左右键导航及命令/应用混合搜索排版；收藏超过三个时折叠到首个图标，其余位置保留智能推荐
            - 简洁模式以窗口中心展开收起，并保持在当前显示器工作区内；Windows 液态材质与毛玻璃有独立视觉效果
            - 剪贴板更新为横向分类、记录/预览双栏、右键操作和固定粘贴栏；支持文档/压缩包/应用分类、分组、敏感标记和拆分接力
            - 剪贴板与命令中心新增独立全局快捷键，支持停用、冲突校验和注册失败回滚
            - 命令中心完善文件搜索、词典、创建工具、执行输出与错误反馈；新增 JSON 格式化、UTF-8 Base64、时间戳、时间/温度单位换算
            - Windows 窗口管理按目标屏幕工作区布局并返回错误；原生耗时命令移至后台线程。浏览器无法执行的本机功能明确提示需桌面版
            - 沿用既有应用标识与本机数据；自有 WebDAV 仍默认关闭，敏感条目与本机文件路径不上传

            Qimiao 1.0 introduces a cat-and-Q identity and ASCII installer names. It fixes keyboard navigation, mixed search layout and center-anchored compact resizing; stacks more than three favorites while preserving suggestions; modernizes clipboard history with horizontal filters, split previews and context actions; adds independent clipboard/command global hotkeys; and improves command execution, file search, dictionary syntax, JSON/Base64/timestamp tools and unit conversion. The existing app identifier and device data are preserved. Clipboard features are selected PasteMemo adaptations, not a complete upstream port.

            验证：20 组前端测试、20 组 Rust 测试、前端生产构建及浏览器交互回归。发布构建覆盖下述平台。Windows 原生快捷键、跨应用粘贴、窗口管理和材质仍需实机验证；测试未实际执行关机等电源操作。

            Downloads: macOS Apple Silicon / Intel, Windows x64 NSIS, Linux x64 / ARM64 (deb, rpm, AppImage). Native Windows interactions still need on-device verification; browser tests do not emulate an actual Windows desktop. Power actions were not executed during testing.

            macOS 构建使用 ad-hoc 签名；Windows 和 Linux 构建未使用商业证书签名。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  finalize:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Verify installers and publish the complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/publish-release.mjs
